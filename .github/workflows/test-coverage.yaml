# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install curl
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: devel
          extra-packages: |
            any::covr
            pharmpy/pharmr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          pct <- round(covr::percent_coverage(cov), 1)
          cat("Total coverage:", pct, "%\n")
          by_file <- covr::tally_coverage(cov, "line")
          by_file <- aggregate(value > 0 ~ filename, by_file, mean)
          names(by_file) <- c("file", "coverage")
          by_file$coverage <- round(100 * by_file$coverage, 1)
          by_file <- by_file[order(by_file$coverage), ]
          cat(
            paste0("## Test coverage: ", pct, "%\n\n"),
            "| File | Coverage (%) |\n|---|---|\n",
            paste0("| ", by_file$file, " | ", by_file$coverage, " |\n"),
            file = Sys.getenv("GITHUB_STEP_SUMMARY"),
            sep = ""
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
